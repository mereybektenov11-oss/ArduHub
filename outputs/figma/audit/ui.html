<!doctype html><html lang="ru"><meta charset="utf-8"><style>body{font:14px/1.4 Arial,sans-serif;padding:16px;background:#f6f3ea;color:#14201a}select{width:100%;padding:10px}button{padding:10px;background:#e9a93b;border:0;border-radius:8px;margin:12px 8px 12px 0}pre{white-space:pre-wrap;max-height:150px;overflow:auto;font:12px/1.4 monospace}img{max-width:100%;max-height:260px;object-fit:contain}</style><h2>Проверка переноса ArduHub</h2><pre id="status">Читаю реальные слои файла…</pre><select id="screen" aria-label="Экран для проверки"></select><button id="focus">Показать на холсте</button><button id="preview">Превью</button><button id="refresh">Проверить повторно</button><button id="repair">Уточнить размеры и текст</button><button id="cleanup">Убрать черновые импорты</button><div><img id="image" alt="Превью из Figma"></div><script>const select=document.getElementById('screen'),status=document.getElementById('status');document.getElementById('focus').onclick=()=>parent.postMessage({pluginMessage:{type:'focus',id:select.value}},'*');document.getElementById('preview').onclick=()=>parent.postMessage({pluginMessage:{type:'preview',id:select.value}},'*');document.getElementById('refresh').onclick=()=>parent.postMessage({pluginMessage:{type:'refresh'}},'*');document.getElementById('repair').onclick=()=>parent.postMessage({pluginMessage:{type:'repair'}},'*');document.getElementById('cleanup').onclick=()=>parent.postMessage({pluginMessage:{type:'cleanup'}},'*');onmessage=e=>{const m=e.data.pluginMessage;if(!m)return;if(m.type==='report'){select.replaceChildren(...m.report.rows.map(r=>{const o=document.createElement('option');o.value=r.id;o.textContent=r.name;return o}));status.textContent=JSON.stringify({screens:m.report.screens,counts:m.report.counts,fonts:m.report.fonts,legacy:m.report.legacy,map:m.report.map},null,2)}if(m.type==='repaired')status.textContent='Уточнено элементов: '+m.count;if(m.type==='focused')status.textContent=m.name+'\nID: '+m.id;if(m.type==='image'){document.getElementById('image').src=URL.createObjectURL(new Blob([m.bytes],{type:'image/png'}));status.textContent=m.name}if(m.type==='error')status.textContent=m.message};</script></html>
